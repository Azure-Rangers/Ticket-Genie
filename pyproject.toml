[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-azure-app"
version = "0.1.0"
description = "Full-stack Streamlit app running on Azure"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.8.0",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]


# ----------------------------------------------------------------------
# TOOL CONFIGURATIONS
# ----------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]


[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]