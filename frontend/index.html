<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketGenie - Sign In</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { min-height: 100vh; background: #f8f0fb; display: flex; justify-content: center; align-items: center; padding: 24px; }
    
    .login-wrapper { width: 100%; max-width: 480px; background: white; border-radius: 14px; box-shadow: 0 16px 35px rgba(43,27,56,0.1); border: 1px solid #e5e7eb; overflow: hidden; }
    
    .login-header { background-color: #5b315d; padding: 30px 24px; color: white; }
    .login-header h1 { font-size: 1.5rem; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; }
    .login-header p { color: #c4b5fd; font-size: 0.85rem; margin-top: 4px; }
    .bot-icon { background: rgba(255,255,255,0.1); color: #facc15; padding: 6px 8px; border-radius: 8px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
    
    .login-form { padding: 30px; display: flex; flex-direction: column; gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field label { color: #374151; font-size: 0.82rem; font-weight: 600; }
    .field input { width: 100%; height: 44px; border: 1px solid #d1d5db; border-radius: 8px; padding: 0 13px; color: #111827; font-size: 0.9rem; outline: none; }
    .field input:focus { border-color: #7a4d86; box-shadow: 0 0 0 3px rgba(122,77,134,0.14); }
    .role-label { color: #374151; font-size: 0.82rem; font-weight: 600; }
    .role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .role-option { border: 1px solid #e5e7eb; border-radius: 9px; padding: 12px 8px; background: #fff; color: #4b5563; cursor: pointer; font-size: 0.76rem; font-weight: 600; text-align: center; transition: 0.2s; }
    .role-option i { display: block; margin-bottom: 6px; font-size: 1.2rem; }
    .role-option:hover, .role-option.selected { border-color: #b58aba; background: #f3e8f5; color: #5b315d; }
    .department-field { display: none; }
    .department-field.visible { display: flex; }
    .department-select { width: 100%; height: 44px; border: 1px solid #d1d5db; border-radius: 8px; padding: 0 13px; color: #374151; background: #fff; font-size: 0.88rem; outline: none; }
    .department-select:focus { border-color: #7a4d86; box-shadow: 0 0 0 3px rgba(122,77,134,0.14); }
    .login-submit { height: 44px; border: 0; border-radius: 8px; background: #7a4d86; color: #fff; cursor: pointer; font-size: 0.9rem; font-weight: 700; }
    .login-submit:hover { background: #633b6f; }
    .login-error { display: none; padding: 10px 12px; border-radius: 7px; background: #fef2f2; color: #b91c1c; font-size: 0.8rem; }
    .login-note { color: #6b7280; font-size: 0.75rem; line-height: 1.45; text-align: center; }
    
    .portal-btn { display: flex; align-items: center; gap: 16px; padding: 20px; border: 1px solid #e5e7eb; border-radius: 12px; background: #ffffff; cursor: pointer; transition: all 0.2s ease; text-align: left; width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
    .portal-btn:hover { border-color: #a5b4fc; background: #fefeff; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(79, 70, 229, 0.08); }
    
    .portal-icon { width: 48px; height: 48px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; flex-shrink: 0; }
    .icon-admin { background: #eef2ff; color: #4f46e5; }
    .icon-employee { background: #f0fdf4; color: #16a34a; }
    .icon-super { background: #fffbeb; color: #b45309; border: 1px solid #fef08a; }
    
    .portal-text h3 { font-size: 1.05rem; color: #111827; margin-bottom: 4px; }
    .portal-text p { font-size: 0.8rem; color: #6b7280; line-height: 1.4; }
    .caret { margin-left: auto; color: #9ca3af; font-size: 1.2rem; }
    
    .portal-btn:hover .caret { color: #4f46e5; transform: translateX(4px); transition: 0.2s; }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-header">
      <h1><span class="bot-icon"><i class="ph-fill ph-ticket"></i></span> TicketGenie</h1>
      <p>Sign in to your support workspace</p>
    </div>
    <form class="login-form" id="loginForm">
      <div class="field"><label for="loginIdentity">Username or email</label><input id="loginIdentity" name="identity" type="text" placeholder="Enter your username or email" autocomplete="username" required></div>
      <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required></div>
      <div class="field"><span class="role-label">Sign in as</span><div class="role-grid" role="radiogroup" aria-label="Choose account type"><button class="role-option selected" type="button" data-role="admin" aria-pressed="true"><i class="ph-duotone ph-shield-check"></i>Admin</button><button class="role-option" type="button" data-role="employee" aria-pressed="false"><i class="ph-duotone ph-user"></i>Employee</button><button class="role-option" type="button" data-role="management" aria-pressed="false"><i class="ph-duotone ph-crown"></i>Upper Management</button></div></div>
      <div class="field department-field visible" id="departmentField"><label for="adminDepartment">Admin department</label><select class="department-select" id="adminDepartment"><option value="IT">IT</option><option value="HR">HR</option><option value="Accounting">Accounting</option></select></div>
      <div class="login-error" id="loginError" role="alert">Enter your username or email and password to continue.</div>
      <button class="login-submit" type="submit">Sign in</button>
      <p class="login-note">Use your TicketGenie workspace credentials. Access is routed according to the selected role.</p>
    </form>
  </div>

  <script>
    let selectedRole = 'admin';
    const departmentField = document.getElementById('departmentField');
    document.querySelectorAll('.role-option').forEach((button) => button.addEventListener('click', () => {
      selectedRole = button.dataset.role;
      departmentField.classList.toggle('visible', selectedRole === 'admin');
      document.querySelectorAll('.role-option').forEach((option) => { const selected = option === button; option.classList.toggle('selected', selected); option.setAttribute('aria-pressed', String(selected)); });
    }));
    document.getElementById('loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const identity = document.getElementById('loginIdentity').value.trim();
      const password = document.getElementById('loginPassword').value;
      const error = document.getElementById('loginError');
      if (!identity || !password) { error.style.display = 'block'; return; }
      error.style.display = 'none';
      const department = document.getElementById('adminDepartment').value;
      const users = {
        admin: { email: identity, role: department, department, name: identity.split('@')[0] || 'Admin' },
        employee: { email: identity, role: 'Employee', name: identity.split('@')[0] || 'Employee' },
        management: { email: identity, role: 'Management', name: identity.split('@')[0] || 'Management' }
      };
      localStorage.setItem('portalUser', JSON.stringify(users[selectedRole]));
      window.location.href = selectedRole === 'employee' ? 'employee_NM/my-tickets.html' : 'admin_AV/admin_dashboard.html';
    });
  </script>
</body>
</html>
