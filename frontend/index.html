<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketGenie - Select Portal</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { height: 100vh; background-color: #f4f5f8; display: flex; justify-content: center; align-items: center; }
    
    .login-wrapper { width: 100%; max-width: 500px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; overflow: hidden; }
    
    .login-header { background-color: #2b1b38; padding: 32px 24px; text-align: center; color: white; }
    .login-header h1 { font-size: 1.5rem; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; }
    .login-header p { color: #a5b4fc; font-size: 0.9rem; }
    .bot-icon { background: rgba(255,255,255,0.1); color: #facc15; padding: 6px 8px; border-radius: 8px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
    
    .portal-container { padding: 32px; display: flex; flex-direction: column; gap: 16px; }
    
    .portal-btn { display: flex; align-items: center; gap: 16px; padding: 20px; border: 1px solid #e5e7eb; border-radius: 12px; background: #ffffff; cursor: pointer; transition: all 0.2s ease; text-align: left; width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
    .portal-btn:hover { border-color: #a5b4fc; background: #fefeff; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(79, 70, 229, 0.08); }
    
    .portal-icon { width: 48px; height: 48px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; flex-shrink: 0; }
    .icon-admin { background: #eef2ff; color: #4f46e5; }
    .icon-employee { background: #f0fdf4; color: #16a34a; }
    .icon-super { background: #fffbeb; color: #b45309; border: 1px solid #fef08a; }
    
    .portal-text h3 { font-size: 1.05rem; color: #111827; margin-bottom: 4px; }
    .portal-text p { font-size: 0.8rem; color: #6b7280; line-height: 1.4; }
    .caret { margin-left: auto; color: #9ca3af; font-size: 1.2rem; }
    
    .portal-btn:hover .caret { color: #4f46e5; transform: translateX(4px); transition: 0.2s; }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-header">
      <h1><span class="bot-icon"><i class="ph-fill ph-ticket"></i></span> TicketGenie</h1>
      <p>Select your workspace to continue</p>
    </div>
    
    <div class="portal-container">
      <button class="portal-btn" onclick="login('Admin_AV')">
        <div class="portal-icon icon-admin"><i class="ph-duotone ph-shield-check"></i></div>
        <div class="portal-text">
          <h3>Login as Admin (AV)</h3>
          <p>Access the HR/IT HelpDesk & Operations Portal</p>
        </div>
        <i class="ph-bold ph-caret-right caret"></i>
      </button>

      <button class="portal-btn" onclick="login('Employee_NM')">
        <div class="portal-icon icon-employee"><i class="ph-duotone ph-user"></i></div>
        <div class="portal-text">
          <h3>Login as Employee (NM)</h3>
          <p>Submit tickets, read policies, and check statuses</p>
        </div>
        <i class="ph-bold ph-caret-right caret"></i>
      </button>

      <button class="portal-btn" onclick="login('SuperAdmin_SS')">
        <div class="portal-icon icon-super"><i class="ph-duotone ph-crown"></i></div>
        <div class="portal-text">
          <h3>Login as SuperAdmin (SS)</h3>
          <p>Full system access, analytics, and settings</p>
        </div>
        <i class="ph-bold ph-caret-right caret"></i>
      </button>
    </div>
  </div>

  <script>
    function login(roleType) {
      if (roleType === 'Admin_AV') {
        localStorage.setItem('portalUser', JSON.stringify({ email: 'av@company.com', role: 'IT', name: 'Admin AV' }));
        window.location.href = 'admin_AV/admin_dashboard.html';
        
      } else if (roleType === 'Employee_NM') {
        localStorage.setItem('portalUser', JSON.stringify({ email: 'nm@company.com', role: 'Employee', name: 'Employee NM' }));
        window.location.href = 'employee_NM/employee_dashboard.html'; 
        
      } else if (roleType === 'SuperAdmin_SS') {
        localStorage.setItem('portalUser', JSON.stringify({ email: 'ss@company.com', role: 'Management', name: 'SuperAdmin SS' }));
        window.location.href = 'admin_AV/admin_dashboard.html';
      }
    }
  </script>
</body>
</html>
