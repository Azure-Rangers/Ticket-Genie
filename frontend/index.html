<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketGenie - Sign In</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { min-height: 100vh; background: #f8f0fb; display: flex; justify-content: center; align-items: center; padding: 24px; }
    
    .login-wrapper { width: 100%; max-width: 520px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; overflow: hidden; }
    
    .login-header { background-color: #5b315d; padding: 30px 24px; color: white; }
    .login-header h1 { font-size: 1.5rem; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; }
    .login-header p { color: #c4b5fd; font-size: 0.85rem; margin-top: 4px; }
    .bot-icon { background: rgba(255,255,255,0.1); color: #facc15; padding: 6px 8px; border-radius: 8px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
    
    .login-form { padding: 30px; display: flex; flex-direction: column; gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field label { color: #374151; font-size: 0.82rem; font-weight: 600; }
    .field input { width: 100%; height: 44px; border: 1px solid #d1d5db; border-radius: 8px; padding: 0 13px; color: #111827; font-size: 0.9rem; outline: none; }
    .field input:focus { border-color: #7a4d86; box-shadow: 0 0 0 3px rgba(122,77,134,0.14); }
    .role-label { color: #374151; font-size: 0.82rem; font-weight: 600; }
    .role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .role-option { border: 1px solid #e5e7eb; border-radius: 9px; padding: 12px 8px; background: #fff; color: #4b5563; cursor: pointer; font-size: 0.76rem; font-weight: 600; text-align: center; transition: 0.2s; }
    .role-option i { display: block; margin-bottom: 6px; font-size: 1.2rem; }
    .role-option:hover, .role-option.selected { border-color: #b58aba; background: #f3e8f5; color: #5b315d; }
    .department-field { display: none; }
    .department-field.visible { display: flex; }
    .department-select { width: 100%; height: 44px; border: 1px solid #d1d5db; border-radius: 8px; padding: 0 13px; color: #374151; background: #fff; font-size: 0.88rem; outline: none; }
    .department-select:focus { border-color: #7a4d86; box-shadow: 0 0 0 3px rgba(122,77,134,0.14); }
    .login-submit { height: 44px; border: 0; border-radius: 8px; background: #7a4d86; color: #fff; cursor: pointer; font-size: 0.9rem; font-weight: 700; }
    .login-submit:hover { background: #633b6f; }
    .login-error { display: none; padding: 10px 12px; border-radius: 7px; background: #fef2f2; color: #b91c1c; font-size: 0.8rem; }
    .login-note { color: #6b7280; font-size: 0.75rem; line-height: 1.45; text-align: center; }
    
    .portal-btn { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border: 1px solid #e5e7eb; border-radius: 12px; background: #ffffff; cursor: pointer; transition: all 0.2s ease; text-align: left; width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
    .portal-btn:hover { border-color: #a5b4fc; background: #fefeff; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(79, 70, 229, 0.08); }
    
    .portal-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 1.4rem; flex-shrink: 0; }
    .icon-admin { background: #eef2ff; color: #4f46e5; }
    .icon-employee { background: #f0fdf4; color: #16a34a; }
    .icon-super { background: #fffbeb; color: #b45309; border: 1px solid #fef08a; }
    
    .portal-text h3 { font-size: 1rem; color: #111827; margin-bottom: 4px; font-weight: 600; }
    .portal-text p { font-size: 0.8rem; color: #6b7280; line-height: 1.4; }
    .caret { margin-left: auto; color: #9ca3af; font-size: 1.2rem; }
    
    .portal-btn:hover .caret { color: #4f46e5; transform: translateX(4px); transition: 0.2s; }

    .azure-status { font-size: 0.78rem; color: #334155; background: #f8fafc; padding: 8px 14px; border-radius: 8px; border: 1px solid #e2e8f0; text-align: center; display: inline-flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 4px; }
    .azure-status code { font-family: monospace; font-weight: 600; color: #2563eb; background: #eff6ff; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-header">
      <h1><span class="bot-icon"><i class="ph-fill ph-ticket"></i></span> TicketGenie</h1>
      <p>Select your workspace to continue</p>
    </div>
    
    <div class="portal-container" style="padding: 24px;">
      <!-- Azure AD Status Badge (Automatically Updated) -->
      <div id="azureStatusBadge" class="azure-status">
        <i class="ph-bold ph-lock-key" style="color:#64748b;"></i> Azure AD: <span>Authenticating Session...</span>
      </div>

      <!-- Admin Login -->
      <button id="adminBtn" class="portal-btn" style="display: none; margin-top: 12px;" onclick="login('Admin_AV')">
        <div class="portal-icon icon-admin"><i class="ph-duotone ph-shield-check"></i></div>
        <div class="portal-text">
          <h3>Login as Admin (AV)</h3>
          <p>Access the HR/IT HelpDesk & Operations Portal</p>
        </div>
        <i class="ph-bold ph-caret-right caret"></i>
      </button>

      <!-- Employee Login -->
      <button id="employeeBtn" class="portal-btn" style="display: none; margin-top: 12px;" onclick="login('Employee_NM')">
        <div class="portal-icon icon-employee"><i class="ph-duotone ph-user"></i></div>
        <div class="portal-text">
          <h3>Login as Employee (NM)</h3>
          <p>Submit tickets, read policies, and check statuses</p>
        </div>
        <i class="ph-bold ph-caret-right caret"></i>
      </button>

      <!-- SuperAdmin Login -->
      <button id="superAdminBtn" class="portal-btn" style="display: none; margin-top: 12px;" onclick="login('SuperAdmin_SS')">
        <div class="portal-icon icon-super"><i class="ph-duotone ph-crown"></i></div>
        <div class="portal-text">
          <h3>SuperAdmin Governance Portal (SS)</h3>
          <p>Full system access, analytics, and settings</p>
        </div>
        <i class="ph-bold ph-caret-right caret"></i>
      </button>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script src="js/azure-auth.js?v=8.0"></script>
  <script>
    function login(roleType) {
      const azureUser = window.AzureAuth ? window.AzureAuth.getAzureUser() : null;
      const objectId = azureUser ? azureUser.objectId : "dc3b56e9-9280-40dc-8d73-98bfd81fdd6a";
      const currentRole = azureUser ? azureUser.role : "Super Admin";

      if (roleType === 'Admin_AV') {
        localStorage.setItem('portalUser', JSON.stringify({
          email: azureUser ? azureUser.email : 'admin.dc3b@ticketgenie.com',
          role: currentRole,
          name: azureUser ? azureUser.name : 'Admin AV',
          objectId: objectId
        }));
        window.location.href = 'admin_AV/admin_dashboard.html';
        
      } else if (roleType === 'Employee_NM') {
        localStorage.setItem('portalUser', JSON.stringify({
          email: azureUser ? azureUser.email : 'nm@company.com',
          role: currentRole,
          name: azureUser ? azureUser.name : 'Employee NM',
          objectId: objectId
        }));
        window.location.href = 'employee_NM/index.html'; 
        
      } else if (roleType === 'SuperAdmin_SS') {
        localStorage.setItem('portalUser', JSON.stringify({
          email: azureUser ? azureUser.email : 'ss@company.com',
          role: currentRole,
          name: azureUser ? azureUser.name : 'SuperAdmin SS',
          objectId: objectId
        }));
        window.location.href = 'management/index.html';
      }
    }
  </script>
</body>
</html>
