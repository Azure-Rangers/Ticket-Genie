<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketGenie - Select Portal</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { height: 100vh; background-color: #f4f5f8; display: flex; justify-content: center; align-items: center; }
    
    .login-wrapper { width: 100%; max-width: 520px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; overflow: hidden; }
    
    .login-header { background-color: #2b1b38; padding: 32px 24px; text-align: center; color: white; }
    .login-header h1 { font-size: 1.5rem; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; }
    .login-header p { color: #a5b4fc; font-size: 0.9rem; }
    .bot-icon { background: rgba(255,255,255,0.1); color: #facc15; padding: 6px 8px; border-radius: 8px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
    
    .portal-container { padding: 32px; display: flex; flex-direction: column; gap: 16px; }
    
    .portal-btn { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border: 1px solid #e5e7eb; border-radius: 12px; background: #ffffff; cursor: pointer; transition: all 0.2s ease; text-align: left; width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
    .portal-btn:hover { border-color: #a5b4fc; background: #fefeff; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(79, 70, 229, 0.08); }
    
    .portal-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 1.4rem; flex-shrink: 0; }
    .icon-admin { background: #eef2ff; color: #4f46e5; }
    .icon-employee { background: #f0fdf4; color: #16a34a; }
    .icon-super { background: #fffbeb; color: #b45309; border: 1px solid #fef08a; }
    
    .portal-text h3 { font-size: 1rem; color: #111827; margin-bottom: 4px; font-weight: 600; }
    .portal-text p { font-size: 0.8rem; color: #6b7280; line-height: 1.4; }
    .caret { margin-left: auto; color: #9ca3af; font-size: 1.2rem; }
    
    .portal-btn:hover .caret { color: #4f46e5; transform: translateX(4px); transition: 0.2s; }

    .azure-status { font-size: 0.78rem; color: #334155; background: #f8fafc; padding: 8px 14px; border-radius: 8px; border: 1px solid #e2e8f0; text-align: center; display: inline-flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 4px; }
    .azure-status code { font-family: monospace; font-weight: 600; color: #2563eb; background: #eff6ff; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-header">
      <h1><span class="bot-icon"><i class="ph-fill ph-ticket"></i></span> TicketGenie</h1>
      <p>Select your workspace to continue</p>
    </div>
    
    <div class="portal-container">
      <!-- Azure AD Status Badge (Automatically Updated by Azure AD authentication) -->
      <div id="azureStatusBadge" class="azure-status">
        <i class="ph-bold ph-lock-key" style="color:#64748b;"></i> Azure AD: <span>Authenticating Session...</span>
      </div>

      <!-- Employee Portal Button (Visible to all authenticated users) -->
      <button id="employeeBtn" class="portal-btn" style="display: none;" onclick="login('Employee_NM')">
        <div class="portal-icon icon-employee"><i class="ph-duotone ph-user"></i></div>
        <div class="portal-text">
          <h3>Employee Portal (NM)</h3>
          <p>Submit tickets, search policies, and check request status</p>
        </div>
        <i class="ph-bold ph-caret-right caret"></i>
      </button>

      <!-- Ticketer / Admin (AV) Button (Visible ONLY to Manager / Admin / Ticketer) -->
      <button id="adminBtn" class="portal-btn" style="display: none;" onclick="login('Admin_AV')">
        <div class="portal-icon icon-admin"><i class="ph-duotone ph-shield-check"></i></div>
        <div class="portal-text">
          <h3>Ticketer / Admin Portal (AV)</h3>
          <p>Manage triage inbox, process tickets, and handle queue requests</p>
        </div>
        <i class="ph-bold ph-caret-right caret"></i>
      </button>

      <!-- SuperAdmin Governance Portal (SS) Button (Visible ONLY to Super Admin) -->
      <button id="superAdminBtn" class="portal-btn" style="display: none;" onclick="login('SuperAdmin_SS')">
        <div class="portal-icon icon-super"><i class="ph-duotone ph-crown"></i></div>
        <div class="portal-text">
          <h3>SuperAdmin Governance Portal (SS)</h3>
          <p>Enterprise control center, RBAC object mapping, and telemetry</p>
        </div>
        <i class="ph-bold ph-caret-right caret"></i>
      </button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/azure-auth.js"></script>
  <script src="/js/theme.js"></script>
  <script>
    function login(roleType) {
      const azureUser = window.AzureAuth ? window.AzureAuth.getAzureUser() : null;
      const objectId = azureUser ? azureUser.objectId : "";
      const currentRole = azureUser ? azureUser.role : "Super Admin";
      
      if (roleType === 'Admin_AV') {
        localStorage.setItem('portalUser', JSON.stringify({
          email: azureUser ? azureUser.email : 'admin@ticketgenie.com',
          role: currentRole,
          name: azureUser ? azureUser.name : 'Admin AV',
          objectId: objectId
        }));
        window.location.href = 'admin_AV/admin_dashboard.html';
        
      } else if (roleType === 'Employee_NM') {
        localStorage.setItem('portalUser', JSON.stringify({
          email: azureUser ? azureUser.email : 'nm@company.com',
          role: currentRole,
          name: azureUser ? azureUser.name : 'Employee NM',
          objectId: objectId
        }));
        window.location.href = 'employee_NM/index.html'; 
        
      } else if (roleType === 'SuperAdmin_SS') {
        localStorage.setItem('portalUser', JSON.stringify({
          email: azureUser ? azureUser.email : 'ss@company.com',
          role: currentRole,
          name: azureUser ? azureUser.name : 'SuperAdmin SS',
          objectId: objectId
        }));
        window.location.href = 'management/index.html';
      }
    }
  </script>
</body>
</html>
