<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketGenie - Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background-color: #f9fafb; color: #1f2937; margin: 0; overflow: hidden; }
    .sidebar { width: 260px; background-color: #2b1b38; color: #d1d5db; display: flex; flex-direction: column; flex-shrink: 0; justify-content: space-between; z-index: 10; transition: width 0.3s ease; white-space: nowrap; overflow-x: hidden; }
    .sidebar.collapsed { width: 80px; }
    .sidebar-top { flex: 1; }
    .sidebar-header { padding: 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .bot-icon { background: rgba(255,255,255,0.1); color: white; padding: 6px; border-radius: 8px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .sidebar-brand-text h2 { color: #ffffff; font-size: 1.1rem; font-weight: 600; margin-bottom: 2px; }
    .sidebar-brand-text span { display: block; font-size: 0.65rem; color: #a5b4fc; text-transform: uppercase; letter-spacing: 1px; }
    .nav-section { margin-top: 24px; }
    .nav-title { font-size: 0.65rem; color: #818cf8; text-transform: uppercase; font-weight: 700; margin: 0 16px 8px; letter-spacing: 1px; transition: opacity 0.2s; }
    .nav-link { display: flex; align-items: center; gap: 12px; padding: 10px 16px; margin: 0 8px 4px; color: #d1d5db; text-decoration: none; font-size: 0.85rem; border-radius: 8px; transition: 0.2s; }
    .nav-link:hover { background-color: rgba(255,255,255,0.05); color: #ffffff; }
    .nav-link.active { background-color: rgba(255,255,255,0.1); color: #ffffff; font-weight: 500; }
    .menu-icon { font-size: 1.1rem; flex-shrink: 0; display: flex; justify-content: center; width: 24px; }
    .sidebar-footer { padding: 24px; font-size: 0.75rem; color: #a5b4fc; border-top: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; flex-shrink: 0; }
    .sidebar.collapsed .sidebar-brand-text, .sidebar.collapsed .nav-title, .sidebar.collapsed .menu-text, .sidebar.collapsed .sidebar-footer-text { display: none; }
    .sidebar.collapsed .sidebar-header { justify-content: center; padding: 24px 0; }
    .sidebar.collapsed .nav-link { justify-content: center; padding: 14px 0; margin: 0 8px 8px; }
    .sidebar.collapsed .sidebar-footer { justify-content: center; padding: 24px 0; }
    
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: #ffffff; border-bottom: 1px solid #e5e7eb; }
    .nav-left-cluster { display: flex; align-items: center; gap: 16px; }
    .btn-hamburger { background: white; border: 1px solid #e5e7eb; border-radius: 8px; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #6b7280; transition: 0.2s; }
    .btn-hamburger:hover { background: #f3f4f6; color: #111827; }
    .nav-actions { display: flex; align-items: center; gap: 16px; }
    .user-profile { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; padding-left: 16px; border-left: 1px solid #e5e7eb; }
    .avatar { width: 32px; height: 32px; background: #eef2ff; color: #4f46e5; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.75rem; font-weight: bold; }

    .page-padding { padding: 40px; max-width: 600px; margin: 0 auto; width: 100%; }
    .eyebrow-text { font-size: 0.7rem; color: #6b7280; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .page-title { font-size: 1.75rem; color: #111827; font-weight: 600; margin-bottom: 32px; }
    
    .settings-card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 32px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
    .input-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 0.8rem; font-weight: 600; color: #374151; }
    .input-group select { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; outline: none; }
    .btn-row { display: flex; gap: 12px; margin-top: 24px; }
    .btn-save { flex: 1; padding: 10px; background: #2b1b38; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-save:hover { background: #4f46e5; }
    .btn-logout { padding: 10px 20px; background: white; border: 1px solid #d1d5db; color: #dc2626; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-logout:hover { background: #fee2e2; border-color: #fca5a5; }
  </style>
</head>
<body class="admin-page">
  <aside class="sidebar" id="appSidebar">
    <div class="sidebar-top">
      <div class="sidebar-header"><div class="bot-icon">🎫</div><div class="sidebar-brand-text"><h2>TicketGenie</h2><span id="sidebarRole">Unified Portal</span></div></div>
      <div class="nav-section"><div class="nav-title">Workspace</div><a href="dashboard.html" class="nav-link"><span class="menu-icon">📊</span><span class="menu-text">My Dashboard</span></a></div>
      <div class="nav-section"><div class="nav-title">Ticketing System</div><a href="submit-ticket.html" class="nav-link"><span class="menu-icon">➕</span><span class="menu-text">Submit Request</span></a><a href="inbox.html" class="nav-link"><span class="menu-icon">📥</span><span class="menu-text">Team Inbox</span></a></div>
      <div class="nav-section"><div class="nav-title">Workforce</div><a href="onboarding.html" class="nav-link"><span class="menu-icon">🚀</span><span class="menu-text">Onboarding & Visas</span></a></div>
      <div class="nav-section" id="adminNav" style="display: none;"><div class="nav-title">Administration</div><a href="knowledge-base.html" class="nav-link"><span class="menu-icon">📚</span><span class="menu-text">Policy Library</span></a><a href="analytics.html" class="nav-link"><span class="menu-icon">📈</span><span class="menu-text">Analytics</span></a></div>
      <div class="nav-section"><div class="nav-title">Account</div><a href="settings.html" class="nav-link active"><span class="menu-icon">⚙️</span><span class="menu-text">Settings</span></a></div>
    </div>
    <div class="sidebar-footer"><div class="status-dot"></div><div class="sidebar-footer-text"><div style="color: white; font-weight: 600;">Systems operational</div></div></div>
  </aside>

  <main class="main-content">
    <div class="top-nav">
      <div class="nav-left-cluster"><button class="btn-hamburger" onclick="toggleSidebar()">☰</button></div>
      <div class="nav-actions">
        <div class="user-profile"><div style="text-align: right;"><div id="navName" style="color: #111827;">User</div><div id="navSubRole" style="font-size: 0.7rem; color: #6b7280;">Role</div></div><div class="avatar" id="navAvatar">U</div></div>
      </div>
    </div>

    <div class="page-padding">
      <div class="eyebrow-text">Account Management</div>
      <h1 class="page-title">Profile Settings</h1>
      <div class="settings-card">
        <div class="input-group">
          <label>Department Role (Demo Switcher)</label>
          <select id="editRole">
            <option value="HR">Human Resources</option>
            <option value="IT">Information Technology</option>
            <option value="Accounting">Accounting & Finance</option>
            <option value="Management">Upper Management</option>
          </select>
        </div>
        <div class="btn-row">
          <button class="btn-logout" onclick="logout()">Log Out</button>
          <button class="btn-save" onclick="saveSettings()">Save Changes</button>
        </div>
      </div>
    </div>
  </main>
  <script>
    let currentUser = {};
    function toggleSidebar() { document.getElementById('appSidebar').classList.toggle('collapsed'); }
    const userDataString = localStorage.getItem('portalUser');
    if (userDataString) {
      currentUser = JSON.parse(userDataString);
      document.getElementById('sidebarRole').innerText = `${currentUser.role} Portal`;
      document.getElementById('navName').innerText = currentUser.name;
      document.getElementById('navSubRole').innerText = `${currentUser.role} Admin`;
      document.getElementById('navAvatar').innerText = currentUser.name.charAt(0).toUpperCase();
      document.getElementById('editRole').value = currentUser.role;
      if (currentUser.role === 'HR' || currentUser.role === 'Management') document.getElementById('adminNav').style.display = 'block';
    } else { window.location.href = 'index.html'; }
    function saveSettings() {
      currentUser.role = document.getElementById('editRole').value;
      localStorage.setItem('portalUser', JSON.stringify(currentUser));
      window.location.reload(); 
    }
    function logout() { localStorage.removeItem('portalUser'); window.location.href = 'index.html'; }
  </script>
</body>
</html>
