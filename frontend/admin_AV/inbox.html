<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketGenie - Team Inbox</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    /* PAGE SPECIFIC INBOX STYLES */

    /* INBOX LAYOUT & FULL HEIGHT SCROLL FIX */
    body.admin-page .main-content { padding: 0 !important; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    .inbox-container { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 70px); background: #f4f5f8; }
    .ticket-list-pane { width: 380px; min-width: 280px; max-width: 600px; background: #ffffff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; height: 100%; overflow: hidden; z-index: 2; flex-shrink: 0; }
    .resizer { width: 6px; background: transparent; cursor: col-resize; transition: background 0.2s; flex-shrink: 0; z-index: 10; position: relative; margin-left: -3px; margin-right: -3px; }
    .resizer:hover, .resizer.dragging { background: #a5b4fc; }
    .pane-header { padding: 24px; border-bottom: 1px solid #e5e7eb; flex-shrink: 0; }
    .pane-header h2 { font-size: 1.2rem; margin-bottom: 16px; color: #111827; font-weight: 600; }
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 8px; }
    .filter-tab { padding: 8px 12px; font-size: 0.8rem; font-weight: 600; border-radius: 6px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
    .filter-tab.active { background: #eef2ff; color: #4f46e5; border-color: #c7d2fe; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1); }
    .filter-tab.inactive { color: #6b7280; }
    .filter-tab.inactive:hover { background: #f3f4f6; }
    .ticket-list { flex: 1; overflow-y: auto; max-height: calc(100vh - 170px); }
    .ticket-item { padding: 20px 24px; border-bottom: 1px solid #f3f4f6; cursor: pointer; transition: background 0.2s; }
    .ticket-item:hover { background: #f9fafb; }
    .ticket-item.active { background: #f4f5f8; border-left: 4px solid #4f46e5; padding-left: 20px; }
    .ticket-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: #6b7280; margin-bottom: 8px; font-weight: 500; }
    .ticket-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; color: #111827; line-height: 1.4; }
    .tag { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; margin-right: 4px; margin-bottom: 4px; }
    .tag-priority-high { background: #fee2e2; color: #b91c1c; }
    .tag-priority-med { background: #fef08a; color: #854d0e; }
    .tag-dept { background: #e0f2fe; color: #0284c7; }

    /* TICKET DETAILS */
    .ticket-detail-pane { flex: 1; display: flex; flex-direction: column; overflow-y: auto; max-height: calc(100vh - 70px); padding: 32px 40px; }
    .detail-header { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
    .detail-top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .detail-top-row h1 { font-size: 1.4rem; color: #111827; font-weight: 600; margin: 0; }
    .ticket-info-bar { display: flex; flex-wrap: wrap; gap: 24px; font-size: 0.85rem; color: #4b5563; padding-top: 16px; border-top: 1px solid #f3f4f6; }
    .info-item span { color: #9ca3af; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
    .info-item strong { color: #111827; font-weight: 600; }
    .detail-body { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    
    .thread-column { display: flex; flex-direction: column; gap: 20px; }
    .message-card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
    .msg-header { display: flex; justify-content: space-between; margin-bottom: 16px; align-items: center; border-bottom: 1px solid #f3f4f6; padding-bottom: 12px; }
    .msg-author { display: flex; align-items: center; gap: 12px; font-weight: 600; color: #111827; font-size: 0.95rem; }
    .msg-author-avatar { width: 32px; height: 32px; background: #eef2ff; color: #4f46e5; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.8rem; }
    .msg-time { font-size: 0.75rem; color: #6b7280; }
    .msg-content { font-size: 0.9rem; color: #374151; line-height: 1.6; }
    .message-card.private-note { background: #fffbeb; border-color: #fde047; }
    .message-card.private-note .msg-author-avatar { background: #fef08a; color: #854d0e; }
    .msg-system { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 12px 20px; border-radius: 8px; font-size: 0.8rem; color: #475569; display: flex; align-items: center; gap: 12px; justify-content: center; font-style: italic; }

    .reply-box { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
    .reply-textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 8px; min-height: 100px; padding: 12px; font-size: 0.9rem; outline: none; margin-bottom: 16px; font-family: inherit; resize: vertical; transition: 0.2s; }
    .reply-textarea:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
    .reply-actions { display: flex; justify-content: space-between; align-items: center; }

    button { transition: all 0.2s ease; cursor: pointer; position: relative; }
    .btn-send { background: #2b1b38; color: white; border: none; padding: 10px 24px; border-radius: 6px; font-weight: 600; }
    .btn-send:hover { background: #4f46e5; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2); }
    .btn-secondary { background: white; color: #374151; border: 1px solid #d1d5db; padding: 10px 16px; border-radius: 6px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .btn-secondary:hover { background: #f3f4f6; border-color: #9ca3af; box-shadow: 0 0 0 4px rgba(107, 114, 128, 0.15); }
    .btn-panel { width: 100%; text-align: left; padding: 10px 16px; background: white; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.85rem; font-weight: 500; color: #374151; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .btn-panel:hover { background: #f9fafb; border-color: #9ca3af; box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.15); }
    .btn-panel.resolve-btn { background: #eef2ff; color: #4f46e5; font-weight: 600; border-color: #c7d2fe; }
    .btn-panel.resolve-btn:hover { background: #e0e7ff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2); }
    .btn-panel.escalate-btn { color: #b91c1c; border-color: #fca5a5; background: #fef2f2; }
    .btn-panel.escalate-btn:hover { background: #fee2e2; box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.2); }

    .insight-column { display: flex; flex-direction: column; gap: 24px; }
    .ai-card { background: linear-gradient(to bottom, #ffffff, #fcfcff); border: 1px solid #c7d2fe; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.05); }
    .ai-header { display: flex; align-items: center; gap: 8px; font-weight: 700; color: #371b58; font-size: 0.95rem; margin-bottom: 16px; border-bottom: 1px solid #e0e7ff; padding-bottom: 12px; }
    .ai-field { margin-bottom: 16px; }
    .ai-field-label { font-size: 0.75rem; color: #6b7280; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; display: block; }
    .ai-field-text { font-size: 0.85rem; color: #374151; line-height: 1.5; }
    .sentiment-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    
    .action-panel { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 4px; }
    .action-panel-title { font-size: 0.8rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }

    .empty-state { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #6b7280; padding: 40px; text-align: center; }
  </style>
</head>
<body class="admin-page">

  <div id="shared-sidebar"></div>

  <main class="main-content">
    <div id="shared-topnav"></div>

    <div class="inbox-container">
      <div class="ticket-list-pane" id="queuePane">
        <div class="pane-header">
          <h2>My Queue</h2>
          <div class="filter-tabs" id="filterTabs">
            <div class="filter-tab active" onclick="switchTab('Open')">Open</div>
            <div class="filter-tab inactive" onclick="switchTab('Pending')">Pending</div>
            <div class="filter-tab inactive" onclick="switchTab('Resolved')">Resolved</div>
          </div>
        </div>
        <div class="ticket-list" id="ticketListContainer"></div>
      </div>

      <div class="resizer" id="dragResizer"></div>
      
      <div class="ticket-detail-pane" id="ticketDetailContainer"></div>
    </div>
  </main>

  <script>
    function toggleSidebar() { document.getElementById('appSidebar').classList.toggle('collapsed'); }
    
    let loggedInUser = "Admin AV";
    let userDataString = localStorage.getItem('portalUser');
    if (!userDataString) {
      const defaultUser = { name: "Admin AV", role: "Operations Admin", email: "admin@ticketgenie.com" };
      localStorage.setItem('portalUser', JSON.stringify(defaultUser));
      userDataString = JSON.stringify(defaultUser);
    }
    const user = JSON.parse(userDataString);
    loggedInUser = user.name;
    if (document.getElementById('sidebarRole')) document.getElementById('sidebarRole').innerText = `${user.role} Portal`;
    if (document.getElementById('navName')) document.getElementById('navName').innerText = user.name;
    if (document.getElementById('navSubRole')) document.getElementById('navSubRole').innerText = `${user.role} Admin`;
    if (document.getElementById('navAvatar')) document.getElementById('navAvatar').innerText = user.name.charAt(0).toUpperCase();


    // Resizer logic
    const resizer = document.getElementById('dragResizer');
    const leftPane = document.getElementById('queuePane');
    let x = 0; let w = 0;
    const mouseDownHandler = function(e) {
        x = e.clientX;
        const styles = window.getComputedStyle(leftPane);
        w = parseInt(styles.width, 10);
        document.addEventListener('mousemove', mouseMoveHandler);
        document.addEventListener('mouseup', mouseUpHandler);
        resizer.classList.add('dragging');
    };
    const mouseMoveHandler = function(e) {
        const dx = e.clientX - x;
        leftPane.style.width = `${w + dx}px`;
    };
    const mouseUpHandler = function() {
        document.removeEventListener('mousemove', mouseMoveHandler);
        document.removeEventListener('mouseup', mouseUpHandler);
        resizer.classList.remove('dragging');
    };
    resizer.addEventListener('mousedown', mouseDownHandler);

    let tickets = [];
    let currentTab = "Open";
    let selectedTicketId = null;

    document.addEventListener("DOMContentLoaded", async () => {
      await loadAdminTickets();
    });

    async function loadAdminTickets() {
      try {
        const rawTickets = await apiFetchTickets();
        tickets = rawTickets.map(t => ({
          id: t.id,
          status: t.status || "Open",
          subject: t.title || "Support Request",
          dept: t.department || "IT Operations",
          priority: t.priority || "Medium",
          priorityClass: (t.priority || "").toLowerCase() === "high" ? "tag-priority-high" : "tag-priority-med",
          requester: "Employee",
          time: t.date || "Today",
          created: t.createdAt ? t.createdAt.split("T")[0] : "Today",
          description: t.description || "No description provided.",
          aiSummary: `Ticket #${t.id} regarding ${t.category || 'Support'}. Current status: ${t.status || 'Open'}.`,
          aiAction: "Review request and process update or route to appropriate team.",
          sentiment: "😐 Neutral",
          sentimentBg: "#f3f4f6",
          sentimentBorder: "#e5e7eb",
          sentimentColor: "#374151",
          thread: [
            { type: 'user', author: 'Employee', avatar: 'EM', time: t.date || 'Today', content: t.description || 'Support request created.' }
          ]
        }));
        renderTicketList();
      } catch (err) {
        console.error("Failed to load tickets:", err);
      }
    }

    function switchTab(tabName) {
      currentTab = tabName;
      const tabs = document.getElementById('filterTabs').children;
      for(let t of tabs) {
        if(t.innerText.includes(tabName)) t.className = "filter-tab active";
        else t.className = "filter-tab inactive";
      }
      renderTicketList();
    }

    function renderTicketList() {
      const listContainer = document.getElementById('ticketListContainer');
      listContainer.innerHTML = "";
      const filteredTickets = tickets.filter(t => (t.status || "").toLowerCase() === currentTab.toLowerCase());
      
      if (filteredTickets.length === 0) {
        listContainer.innerHTML = `<div style="padding: 24px; text-align: center; color: #9ca3af; font-size: 0.85rem;">No ${currentTab.toLowerCase()} tickets found.</div>`;
        document.getElementById('ticketDetailContainer').innerHTML = `<div class="empty-state"><i class="ph-duotone ph-envelope-open" style="font-size: 3rem; margin-bottom: 16px; opacity: 0.5;"></i><h2>No Ticket Selected</h2></div>`;
        return;
      }
      if (!selectedTicketId || !filteredTickets.find(t => t.id === selectedTicketId)) {
        selectedTicketId = filteredTickets[0].id;
      }

      filteredTickets.forEach(ticket => {
        const isActive = ticket.id === selectedTicketId ? "active" : "";
        listContainer.innerHTML += `
          <div class="ticket-item ${isActive}" onclick="selectTicket('${ticket.id}')">
            <div class="ticket-meta"><span>${ticket.id} • ${ticket.dept}</span> <span>${ticket.time}</span></div>
            <div class="ticket-title">${escapeHTML(ticket.subject)}</div>
            <div><span class="tag ${ticket.priorityClass}">${ticket.priority}</span></div>
          </div>
        `;
      });
      renderTicketDetail();
    }

    function selectTicket(id) {
      selectedTicketId = id;
      renderTicketList();
    }

    async function renderTicketDetail() {
      const ticket = tickets.find(t => t.id === selectedTicketId);
      if (!ticket) return;

      const comments = await apiGetComments(ticket.id);
      const detailContainer = document.getElementById('ticketDetailContainer');
      let threadHTML = `<div class="message-card"><div class="msg-header"><div class="msg-author"><div class="msg-author-avatar">EM</div> Requester</div><div class="msg-time">${ticket.time}</div></div><div class="msg-content">${escapeHTML(ticket.description)}</div></div>`;
      
      if (comments && comments.length > 0) {
        comments.forEach(c => {
          threadHTML += `<div class="message-card"><div class="msg-header"><div class="msg-author"><div class="msg-author-avatar">${c.sender_role ? c.sender_role.charAt(0) : 'A'}</div> ${escapeHTML(c.sender_role || 'Admin')}</div><div class="msg-time">${c.createdAt ? c.createdAt.split('T')[0] : 'Today'}</div></div><div class="msg-content">${escapeHTML(c.message)}</div></div>`;
        });
      }

      let replyBoxHTML = ticket.status !== 'Resolved' ? `
          <div class="reply-box">
            <div style="font-size: 0.85rem; font-weight: 600; margin-bottom: 12px; color: #111827;">Add response:</div>
            <textarea id="replyText" class="reply-textarea" placeholder="Type your message..."></textarea>
            <div class="reply-actions">
              <button class="btn-secondary" onclick="addNote(this)"><i class="ph-fill ph-lock-key"></i> Internal Note</button>
              <button class="btn-send" onclick="sendReply(this)">Send Reply</button>
            </div>
          </div>
        ` : '';

      detailContainer.innerHTML = `
        <div class="detail-header">
          <div class="detail-top-row">
            <h1>Ticket ${ticket.id}: ${escapeHTML(ticket.subject)}</h1>
            <span class="tag ${ticket.priorityClass}" style="font-size: 0.8rem; padding: 6px 12px;">${ticket.priority} Priority</span>
          </div>
          <div class="ticket-info-bar">
            <div class="info-item"><span>Requester</span><strong>${ticket.requester}</strong></div>
            <div class="info-item"><span>Department</span><strong>${ticket.dept}</strong></div>
            <div class="info-item"><span>Created</span><strong>${ticket.created}</strong></div>
            <div class="info-item"><span>Status</span><strong>${ticket.status}</strong></div>
          </div>
        </div>
        <div class="detail-body">
          <div class="thread-column">${threadHTML}${replyBoxHTML}</div>
          <div class="insight-column">
            <div class="ai-card">
              <div class="ai-header"><i class="ph-fill ph-magic-wand" style="font-size:1.2rem; color:#818cf8;"></i> Genie AI Analysis</div>
              <div class="ai-field"><span class="ai-field-label">Issue Summary</span><div class="ai-field-text">${escapeHTML(ticket.aiSummary)}</div></div>
              <div class="ai-field"><span class="ai-field-label">Suggested Action</span><div class="ai-field-text">${escapeHTML(ticket.aiAction)}</div></div>
              <div class="ai-field"><span class="ai-field-label">Sentiment</span><div class="sentiment-badge" style="background:${ticket.sentimentBg}; border-color:${ticket.sentimentBorder}; color:${ticket.sentimentColor};">${ticket.sentiment}</div></div>
            </div>
            ${ticket.status !== 'Resolved' ? `
            <div class="action-panel">
              <div class="action-panel-title">Ticket Actions</div>
              <button class="btn-panel" onclick="simulateAction('In Progress', this)">Mark In Progress <i class="ph-bold ph-caret-right"></i></button>
              <button class="btn-panel resolve-btn" onclick="simulateAction('Resolved', this)"><i class="ph-bold ph-check"></i> Mark as Resolved</button>
            </div>` : ''}
          </div>
        </div>
      `;
    }

    async function simulateAction(actionName, btn) {
      await apiUpdateTicket(selectedTicketId, { status: actionName });
      await loadAdminTickets();
    }

    async function addNote(btn) {
      const text = document.getElementById('replyText').value.trim();
      if(!text) return;
      await apiPostComment(selectedTicketId, `[Internal Note] ${text}`, "Operations Admin");
      renderTicketDetail();
    }

    async function sendReply(btn) {
      const text = document.getElementById('replyText').value.trim();
      if(!text) return;
      await apiPostComment(selectedTicketId, text, "Operations Admin");
      renderTicketDetail();
    }

    renderTicketList();

    // Auto-refresh comment thread every 2.5 seconds for live messaging with employee
    setInterval(async () => {
      if (!selectedTicketId) return;
      const threadCol = document.querySelector('.thread-column');
      if (!threadCol) return;

      const ticket = tickets.find(t => t.id === selectedTicketId);
      if (!ticket) return;

      const comments = await apiGetComments(selectedTicketId);
      let threadHTML = `<div class="message-card"><div class="msg-header"><div class="msg-author"><div class="msg-author-avatar">EM</div> Requester</div><div class="msg-time">${ticket.time}</div></div><div class="msg-content">${escapeHTML(ticket.description)}</div></div>`;
      
      if (comments && comments.length > 0) {
        comments.forEach(c => {
          const isEmployee = (c.sender_role || "").toLowerCase() === "employee";
          const avatarClass = isEmployee ? "" : "hr-avatar";
          const roleName = isEmployee ? "Employee" : (c.sender_role || "Operations Admin");
          threadHTML += `<div class="message-card ${isEmployee ? 'employee-card' : 'hr-card'}"><div class="msg-header"><div class="msg-author"><div class="msg-author-avatar ${avatarClass}">${isEmployee ? 'EM' : '<i class="fa-solid fa-user-shield"></i>'}</div> ${escapeHTML(roleName)}</div><div class="msg-time">${c.createdAt ? c.createdAt.replace('T', ' ').substring(0, 16) : 'Today'}</div></div><div class="msg-content">${escapeHTML(c.message)}</div></div>`;
        });
      }

      const existingCards = threadCol.querySelectorAll('.message-card');
      const currentCardsCount = existingCards ? existingCards.length : 0;
      const newCardsCount = (comments ? comments.length : 0) + 1;

      if (currentCardsCount !== newCardsCount) {
        const replyBox = threadCol.querySelector('.reply-box');
        const replyBoxHTML = replyBox ? replyBox.outerHTML : '';
        threadCol.innerHTML = threadHTML + replyBoxHTML;
      }
    }, 2500);
  </script>

  <!-- Floating Genie Widget Button -->
  <button class="fab-genie" id="genieButton" type="button" title="Ask Genie AI">
    <i class="ph-fill ph-magic-wand"></i> Ask Genie
  </button>

  <!-- Genie AI Chat Panel -->
  <div class="genie-chat" id="genieChat">
    <div class="genie-chat-header">
      <div class="genie-header-info">
        <div class="genie-avatar"><i class="ph-fill ph-magic-wand"></i></div>
        <div><strong>Genie AI Assistant</strong><span><span class="genie-status-dot"></span> Online</span></div>
      </div>
      <button class="genie-close" id="closeGenieButton" type="button" aria-label="Close"><i class="ph-bold ph-x"></i></button>
    </div>
    <div class="genie-messages" id="genieMessages">
      <div class="genie-message">
        <div class="genie-message-avatar"><i class="ph-fill ph-magic-wand"></i></div>
        <div class="genie-bubble">Hi! I'm Genie, your AI Assistant. How can I help you manage tickets, policies, or workspace requests today?</div>
      </div>
    </div>
    <div class="genie-suggestions">
      <button type="button" class="genie-suggestion">Show open ticket queue</button>
      <button type="button" class="genie-suggestion">How do I route tickets?</button>
    </div>
    <div class="genie-input-area">
      <input type="text" id="genieInput" placeholder="Ask Genie something..." autocomplete="off">
      <button type="button" id="genieSendButton" aria-label="Send"><i class="ph-bold ph-paper-plane-right"></i></button>
    </div>
    <div class="genie-disclaimer">TicketGenie AI Assistant • Operations Help</div>
  </div>

  <script src="../js/script.js"></script>
  <script src="components.js"></script>
</body>
</html>
