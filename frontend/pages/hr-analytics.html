<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket-Genie | HR Analytics</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        
        <nav class="sidebar">
            <div class="logo">
                <h2>Ticket-Genie</h2>
            </div>
            <ul class="nav-links">
                <li><a href="hr-portal.html">Dashboard</a></li>
                <li><a href="hr-tickets.html">Manage Tickets</a></li>
                <li><a href="hr-knowledge.html">Knowledge Base</a></li>
                <li class="active"><a href="hr-analytics.html">Analytics</a></li>
            </ul>
            <div class="genie-panel-teaser">
                <p>✨ Genie AI is active</p>
            </div>
        </nav>

        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <input type="text" placeholder="Search data...">
                </div>
                <div class="user-profile">
                    <span>HR Representative</span>
                </div>
            </header>
            
            <section class="dashboard-area">
                <div class="dashboard-header">
                    <h1>HR Analytics & Reports</h1>
                    <p>Track ticket volume, categories, and resolution times.</p>
                </div>

                <div class="analytics-grid">
                    <div class="chart-card">
                        <h3>Tickets by Category (This Month)</h3>
                        <canvas id="categoryChart"></canvas>
                    </div>

                    <div class="chart-card">
                        <h3>Ticket Volume (Past 7 Days)</h3>
                        <canvas id="volumeChart"></canvas>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <script>
        // 1. Chart Colors to match your theme
        const purpleMain = '#6f42c1';
        const purpleLight = '#d1c4e9';
        const grayMain = '#6c757d';

        // 2. Draw the Category Bar Chart
        const ctxCategory = document.getElementById('categoryChart').getContext('2d');
        new Chart(ctxCategory, {
            type: 'bar',
            data: {
                labels: ['Payroll', 'Benefits', 'Conflicts', 'Policy', 'Onboarding'],
                datasets: [{
                    label: 'Number of Tickets',
                    data: [12, 19, 5, 8, 14],
                    backgroundColor: purpleMain,
                    borderRadius: 4
                }]
            },
            options: { responsive: true }
        });

        // 3. Draw the Volume Line Chart
        const ctxVolume = document.getElementById('volumeChart').getContext('2d');
        new Chart(ctxVolume, {
            type: 'line',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Number of Tickets',
                    data: [12, 19, 5, 8, 14],
                    // We replaced the single color with an array of purple shades!
                    backgroundColor: [
                        '#4b2b82', // Darkest
                        '#5c35a1', // Darker
                        '#6f42c1', // Main Purple
                        '#9474d1', // Lighter
                        '#bda6e3'  // Lightest
                    ],
                    borderRadius: 4
                }]
            },
            options: { responsive: true }
        });
    </script>
</body>
</html>
