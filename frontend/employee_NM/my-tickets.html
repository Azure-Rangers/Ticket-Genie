<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets | TicketGenie</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="employee.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div id="shared-sidebar"></div>

<main class="main-content">
    <div id="shared-topnav"></div>

    <section class="section">
        <div class="section-header">
            <div>
                <h3>All Support Requests</h3>
                <p>Click any ticket below to open its conversation thread with HR.</p>
            </div>
        </div>

        <div class="tickets-table">
            <div class="table-header">
                <div>Request</div>
                <div>Category / Dept</div>
                <div>Status</div>
                <div>Priority</div>
                <div>Date</div>
            </div>

            <div id="myTicketsList"></div>
        </div>
    </section>
</main>

<!-- Genie AI Floating Button & Drawer -->
<button class="genie-button" id="genieButton" type="button">
    <i class="fa-solid fa-wand-magic-sparkles"></i>
    <span>Ask Genie</span>
</button>

<div class="genie-chat" id="genieChat">
    <div class="genie-chat-header">
        <div class="genie-header-info">
            <div class="genie-avatar">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <div>
                <strong>Genie AI</strong>
                <span><span class="genie-status-dot"></span> Online</span>
            </div>
        </div>
        <button class="genie-close" id="closeGenieButton" type="button">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    <div class="genie-messages" id="genieMessages">
        <div class="genie-message">
            <div class="genie-message-avatar">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <div class="genie-bubble">
                Hi! I'm Genie, your AI support assistant. How can I help you today?
            </div>
        </div>
    </div>
    <div class="genie-input-area">
        <input type="text" id="genieInput" placeholder="Ask a question..." autocomplete="off">
        <button id="genieSendButton" type="button">
            <i class="fa-solid fa-arrow-up"></i>
        </button>
    </div>
    <div class="genie-disclaimer">
        Genie may occasionally provide inaccurate information.
    </div>
</div>

<script src="../js/script.js"></script>
<script src="components.js"></script>
</body>
</html>
