<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketGenie - HR Analytics</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { display: flex; height: 100vh; background-color: #f8fafc; color: #1f2937; margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #shared-sidebar { display: flex; }
    .sidebar { width: 260px; background-color: #2b1b36; color: #d1d5db; display: flex; flex-direction: column; flex-shrink: 0; justify-content: space-between; height: 100vh; }
    .sidebar-header { padding: 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .brand-badge { background: #4f46e5; color: white; width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .sidebar-header h2 { color: #ffffff; font-size: 1.15rem; margin: 0; }
    .sidebar-header span { font-size: 0.7rem; color: #a5b4fc; text-transform: uppercase; letter-spacing: 1px; }
    .nav-section { padding: 16px; }
    .nav-title { font-size: 0.7rem; color: #818cf8; text-transform: uppercase; font-weight: bold; margin-bottom: 12px; letter-spacing: 1px; padding-left: 8px; }
    .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #cbd5e1; text-decoration: none; border-radius: 8px; font-size: 0.88rem; margin-bottom: 4px; transition: all 0.2s; }
    .nav-link:hover, .nav-link.active { background-color: rgba(255,255,255,0.1); color: #ffffff; font-weight: 600; }
    .sidebar-footer { padding: 20px 24px; font-size: 0.75rem; color: #a5b4fc; border-top: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; }

    .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 40px; border-bottom: 1px solid #e2e8f0; background: white; }
    .page-title-header h1 { font-size: 1.4rem; color: #0f172a; margin: 0; }
    .page-title-header p { font-size: 0.82rem; color: #64748b; margin: 2px 0 0 0; }
    .nav-actions { display: flex; align-items: center; gap: 16px; }
    .search-small { display: flex; align-items: center; background: #f1f5f9; padding: 8px 16px; border-radius: 8px; width: 280px; }
    .search-small input { border: none; background: transparent; outline: none; margin-left: 8px; font-size: 0.85rem; width: 100%; }
    .switch-role-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: #eef2ff; color: #4f46e5; border-radius: 8px; text-decoration: none; font-size: 0.82rem; font-weight: 600; }
    .user-profile { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
    .avatar { width: 34px; height: 34px; background: #fffbeb; color: #b45309; border: 1px solid #fef08a; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.9rem; }
    .user-name { font-weight: 600; color: #0f172a; font-size: 0.85rem; }
    .user-role { font-size: 0.72rem; color: #64748b; }

    .page-padding { padding: 36px 40px; max-width: 1200px; width: 100%; margin: 0 auto; }
    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 28px; }
    .metric-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; }
    .metric-title { font-size: 0.82rem; color: #64748b; font-weight: 500; }
    .metric-val { font-size: 2rem; font-weight: 700; color: #0f172a; margin-top: 6px; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 28px; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: #0f172a; margin-bottom: 16px; }
  </style>
</head>
<body>

  <div id="shared-sidebar"></div>

  <div class="main-wrapper">
    <div id="shared-topnav"></div>

    <main class="page-padding">
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-title">Avg Resolution Speed</div>
          <div class="metric-val" id="avgSpeed">3.4 Hours</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Auto-Resolution Success</div>
          <div class="metric-val" id="autoRate">40.0%</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Total Resolved Tickets</div>
          <div class="metric-val" id="totalRes">86</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📈 Ticket Breakdown & Resolution Trends</div>
        <pre id="analyticsJson" style="background:#f8fafc; padding:20px; border-radius:8px; font-size:0.88rem; font-family:monospace; color:#334155;"></pre>
      </div>
    </main>
  </div>

  <script src="../js/script.js"></script>
  <script src="components.js"></script>
  <script>
    initSharedComponents("analytics", "HR Analytics & Resolution Trends", "Real-Time Helpdesk AI Metrics and SLA Performance");

    document.addEventListener("DOMContentLoaded", async () => {
      const res = await fetch("/api/analytics/trends");
      const data = await res.json();
      document.getElementById("avgSpeed").textContent = `${data.avg_resolution_time_hours} Hours`;
      document.getElementById("autoRate").textContent = `${data.auto_resolution_rate_pct}%`;
      document.getElementById("totalRes").textContent = data.resolved_tickets || 86;
      document.getElementById("analyticsJson").textContent = JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>
