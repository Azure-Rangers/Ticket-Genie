<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketGenie - HR Analytics</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { display: flex; height: 100vh; background-color: #f8fafc; color: #1f2937; margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #shared-sidebar { display: flex; }
    .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }

    .page-padding { padding: 36px 40px; max-width: 1200px; width: 100%; margin: 0 auto; }
    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 28px; }
    .metric-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; }
    .metric-title { font-size: 0.82rem; color: #64748b; font-weight: 500; }
    .metric-val { font-size: 2rem; font-weight: 700; color: #0f172a; margin-top: 6px; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 28px; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: #0f172a; margin-bottom: 16px; }
  </style>
</head>
<body>

  <div id="shared-sidebar"></div>

  <div class="main-wrapper">
    <div id="shared-topnav"></div>

    <main class="page-padding">
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-title">Avg Resolution Speed</div>
          <div class="metric-val" id="avgSpeed">3.4 Hours</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Auto-Resolution Success</div>
          <div class="metric-val" id="autoRate">40.0%</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Total Resolved Tickets</div>
          <div class="metric-val" id="totalRes">86</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📈 Ticket Breakdown & Resolution Trends</div>
        <pre id="analyticsJson" style="background:#f8fafc; padding:20px; border-radius:8px; font-size:0.88rem; font-family:monospace; color:#334155;"></pre>
      </div>
    </main>
  </div>

  <script src="../js/script.js"></script>
  <script src="components.js"></script>
  <script>
    initSharedComponents("analytics", "HR Analytics & Resolution Trends", "Real-Time Helpdesk AI Metrics and SLA Performance");

    document.addEventListener("DOMContentLoaded", async () => {
      const res = await fetch("/api/analytics/trends");
      const data = await res.json();
      document.getElementById("avgSpeed").textContent = `${data.avg_resolution_time_hours} Hours`;
      document.getElementById("autoRate").textContent = `${data.auto_resolution_rate_pct}%`;
      document.getElementById("totalRes").textContent = data.resolved_tickets || 86;
      document.getElementById("analyticsJson").textContent = JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>
