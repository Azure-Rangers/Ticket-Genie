            - Accounting Team
            - Workplace Operations Team
            - IT Team
            - Upper Management
          - type: 'null'
          title: Department
        preferredDate:
          anyOf:
          - type: string
          - type: 'null'
          title: Preferreddate
        is_anonymous:
          type: boolean
          title: Is Anonymous
          default: false
        attachment:
          anyOf:
          - type: string
          - type: 'null'
          title: Attachment
        requester_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Requester Id
        department_override:
          anyOf:
          - type: string
            enum:
            - HR Team
            - Accounting Team
            - Workplace Operations Team
            - IT Team
            - Upper Management
          - type: 'null'
          title: Department Override
      type: object
      required:
      - title
      - description
      title: TicketCreate
    TicketDraft:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Title
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        priority:
          anyOf:
          - type: string
          - type: 'null'
          title: Priority
        department:
          anyOf:
          - type: string
          - type: 'null'
          title: Department
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        preferredDate:
          anyOf:
          - type: string
          - type: 'null'
          title: Preferreddate
        startDate:
          anyOf:
          - type: string
          - type: 'null'
          title: Startdate
        endDate:
          anyOf:
          - type: string
          - type: 'null'
          title: Enddate
        is_anonymous:
          type: boolean
          title: Is Anonymous
          default: false
        attachment:
          anyOf:
          - type: string
          - type: 'null'
          title: Attachment
      type: object
      title: TicketDraft
      description: 'Mirrors models.ticket.TicketCreate exactly (all fields optional
        here

        since a draft may still be incomplete). This is never auto-submitted;

        the frontend places it into the existing Standard Request form for the

        user to review, edit, and submit via the existing POST /api/tickets flow.'
    TicketResponse:
      properties:
        id:
          type: string
          title: Id
