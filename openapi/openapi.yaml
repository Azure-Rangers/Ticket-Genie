      title: OnboardingUpdateRequest
    PendingManagementAction:
      properties:
        action_type:
          $ref: '#/components/schemas/ChatIntent'
        awaiting:
          anyOf:
          - type: string
          - type: 'null'
          title: Awaiting
        ticket_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Ticket Id
        ticket_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Ticket Title
        current_department:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Department
        current_priority:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Priority
        target_department:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Department
        target_priority:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Priority
        candidate_tickets:
          items:
            $ref: '#/components/schemas/TicketCandidate'
          type: array
          title: Candidate Tickets
        employee_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Employee Name
        employee_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Employee Email
        employee_object_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Employee Object Id
        employee_role:
          anyOf:
          - type: string
          - type: 'null'
          title: Employee Role
        employee_department:
          anyOf:
          - type: string
          - type: 'null'
          title: Employee Department
      type: object
      required:
      - action_type
      title: PendingManagementAction
      description: 'Structured, client-echoed state for an in-progress management
        write

        action (reassign_ticket / change_priority / create_portal_employee).

        Mirrors how `draft`/`active_intent` already carry ticket-drafting state

        across turns - the backend stays stateless, the frontend just echoes

        back whatever the previous ChatResponse.pending_action was.


        `awaiting` names exactly what the next user turn is expected to resolve,

        so services.management_action_service never has to re-guess intent

        from free text alone: "ticket_selection" | "ticket_confirmation" |

        "target_department" | "target_priority" | "employee_field:<name>" |

        "employee_confirmation".'
    ReActAgentRequest:
      properties:
        message:
          type: string
          title: Message
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
      type: object
      required:
      - message
      title: ReActAgentRequest
    RequestType:
      type: string
      enum:
      - standard
      - anonymous
      - leave_management
      title: RequestType
      description: 'Which of the three existing New Request tabs a ticket_draft is
        meant

        for: standardRequestTab, anonymousRequestTab, or leaveRequestTab (see

        frontend/employee_NM/new-request.html). This is separate from

        ChatIntent - intent says "the user wants to submit a request";

        request_type says which existing form that request belongs in.'
    TicketCandidate:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        department:
          type: string
          title: Department
        priority:
          type: string
          title: Priority
        status:
          type: string
          title: Status
