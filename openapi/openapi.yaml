components:
  schemas:
    AnnouncementCreateRequest:
      properties:
        title:
          type: string
          title: Title
        content:
          type: string
          title: Content
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
          default: General Alert
        author:
          anyOf:
          - type: string
          - type: 'null'
          title: Author
          default: Admin Operations
      type: object
      required:
      - title
      - content
      title: AnnouncementCreateRequest
    AzureLoginRequest:
      properties:
        azure_object_id:
          type: string
          title: Azure Object Id
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        id_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Id Token
      type: object
      required:
      - azure_object_id
      title: AzureLoginRequest
    ChatAction:
      properties:
        type:
          type: string
          title: Type
        target:
          anyOf:
          - type: string
          - type: 'null'
          title: Target
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        ticket_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Ticket Id
      type: object
      required:
      - type
      title: ChatAction
      description: A machine-actionable follow-up the frontend can execute.
    ChatIntent:
      type: string
      enum:
      - navigation
      - how_to
      - knowledge
      - create_ticket
      - leave_management
      - ticket_status
      - support_issue
      - general
      - reassign_ticket
      - change_priority
      - create_portal_employee
      title: ChatIntent
    ChatRequest:
      properties:
        message:
          type: string
          title: Message
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
          default: Employee
        department:
          anyOf:
          - type: string
          - type: 'null'
          title: Department
        history:
          items:
            $ref: '#/components/schemas/ChatTurn'
          type: array
          title: History
        draft:
          anyOf:
          - $ref: '#/components/schemas/TicketDraft'
          - type: 'null'
        active_intent:
          anyOf:
          - $ref: '#/components/schemas/ChatIntent'
          - type: 'null'
        active_request_type:
          anyOf:
          - $ref: '#/components/schemas/RequestType'
          - type: 'null'
        pending_action:
          anyOf:
          - $ref: '#/components/schemas/PendingManagementAction'
          - type: 'null'
      type: object
      required:
      - message
      title: ChatRequest
    ChatResponse:
      properties:
        message:
          type: string
          title: Message
        intent:
          $ref: '#/components/schemas/ChatIntent'
        action:
          anyOf:
          - $ref: '#/components/schemas/ChatAction'
          - type: 'null'
        request_type:
          anyOf:
          - $ref: '#/components/schemas/RequestType'
          - type: 'null'
        ticket_draft:
          anyOf:
          - $ref: '#/components/schemas/TicketDraft'
          - type: 'null'
        missing_fields:
          items:
            type: string
          type: array
          title: Missing Fields
        suggestions:
          items:
            type: string
          type: array
          title: Suggestions
        knowledge_verified:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Knowledge Verified
        ready_for_review:
          type: boolean
          title: Ready For Review
          default: false
        pending_action:
          anyOf:
          - $ref: '#/components/schemas/PendingManagementAction'
          - type: 'null'
        ticket_candidates:
          items:
            $ref: '#/components/schemas/TicketCandidate'
          type: array
          title: Ticket Candidates
      type: object
      required:
