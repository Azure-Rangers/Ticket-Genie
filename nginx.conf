server {
    listen 80;
    server_name localhost;

    # 1. Serve static frontend assets
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse proxy API requests to FastAPI backend service
    location /api/ {
        proxy_pass https://webapp-prod-backend-ticketgenie.azurewebsites.net/api/;
        proxy_set_header Host webapp-prod-backend-ticketgenie.azurewebsites.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
