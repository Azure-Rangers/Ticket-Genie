name: Production Infrastructure and Azure Handoff

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      force_terraform:
        description: 'Force run Terraform Apply even if no terraform files changed'
        required: false
        type: boolean
        default: true

concurrency:
  group: production-infra-apply
  cancel-in-progress: false

jobs:
  docker-build:
    name: Build Production Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ticket-genie-prod .

  changes:
    name: Check for Terraform Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'

  terraform-apply:
    name: Terraform Apply and Azure Handoff
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_terraform || needs.changes.outputs.terraform == 'true' }}
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          scope: 'resourcegroup'
          resource-group-name: 'Azure_Rangers'

      - name: Terraform Init and Apply
        working-directory: terraform
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Trigger Azure DevOps Pipeline
        env:
          AZURE_DEVOPS_TOKEN: ${{ secrets.AZ_DEVOPS_PAT }}
          ADO_ORGANIZATION: "Your-ADO-Org"
          ADO_PROJECT: "Your-ADO-Project"
          PIPELINE_ID: "1"
        run: |
          curl -X POST \
            -u ":$AZURE_DEVOPS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"resources": {"repositories": {"self": {"refName": "refs/heads/main"}}}}' \
            "https://dev.azure.com/${ADO_ORGANIZATION}/${ADO_PROJECT}/_apis/build/builds?api-version=7.0"