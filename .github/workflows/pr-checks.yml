name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install .[backend,dev]

      - name: Run Ruff checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest

  test-backend:
    name: FastAPI Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install .[backend,dev]


      - name: Run Pytest
        run: pytest tests/

  docker-checks:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Docker image
        run: docker build --target backend -t ticket-genie-backend-pr-check .

      - name: Start Backend container
        run: docker run -d --name ticket-genie-backend-pr-check -p 8000:8000 ticket-genie-backend-pr-check

      - name: Wait for FastAPI health check
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Stop Backend container
        if: always()
        run: docker rm -f ticket-genie-backend-pr-check


  terraform-checks:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format and validate Terraform
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate