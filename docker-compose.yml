services:
  backend:
    build:
      context: .
      target: backend
    container_name: ticketgenie-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:////data/ticketgenie.db
      - USE_MOCK_AI=false
      - AZURE_OPENAI_DEPLOYMENT=gpt-5.2
    env_file:
      - .env
    volumes:
      - ticketgenie-data:/data

  frontend:
    build:
      context: .
      target: frontend
    container_name: ticketgenie-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  ticketgenie-data:
